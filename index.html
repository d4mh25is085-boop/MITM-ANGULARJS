<!DOCTYPE html>
<html lang="en" ng-app="myApp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>First Angular project</title>
     <script src="node_modules/angular/angular.js"></script>
     <script src="app.js"></script>

</head>
<body ng-controller="MyController">
    
<h1>student details</h1>
<h2>{{name}}</h2>

<h3>update the student name</h3>

<input type="text" ng-model="name">
<input type="text" ng-model="age">
<input type="text" ng-model="department">
<input type="text" ng-model="semester">
<p>updated name: {{name}}</p>
<p>updated age: {{age}}</p>
<p>updated department: {{department}}</p>
<p>updated semester: {{semester}}</p>
</body>
</html>
